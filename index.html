  <script>
    // Hide animated elements before first paint only when motion is allowed.
    // If scripts fail to run within 3s, everything is shown as-is.
    (function () {
      var d = document.documentElement;
      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        d.classList.add("motion");
        window.__motionFallback = setTimeout(function () { d.classList.remove("motion"); }, 3000);
      }
    })();
  </script>
